version: 2

# Contracts: the dashboard and anything downstream rely on these shapes, money included.
models:
  - name: fct_trades
    description: >
      Every official trade exactly once (grain: symbol + trade_id), with the Crypto project's live anomaly
      scores where it captured the trade. Trades the Crypto project missed come from the exchange's record.
    config:
      contract: {enforced: true}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [symbol, trade_id]
    columns:
      - name: symbol
        description: "{{ doc('col_symbol') }}"
        data_type: varchar
        constraints: [{type: not_null}]
      - name: trade_id
        description: "{{ doc('col_trade_id') }}"
        data_type: bigint
        constraints: [{type: not_null}]
      - name: trade_date
        data_type: date
        constraints: [{type: not_null}]
        description: UTC day of the trade.
      - name: trade_time_utc
        description: "When the trade happened, in UTC."
        data_type: timestamp
        constraints: [{type: not_null}]
      - name: price
        description: "Trade price in the quote currency (USDT), exact."
        data_type: decimal(20,8)
        constraints: [{type: not_null}]
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, inclusive: false}
      - name: quantity
        description: "Amount traded in the base currency (for example BTC), exact."
        data_type: decimal(20,8)
        constraints: [{type: not_null}]
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, inclusive: false}
      - name: quote_amount
        data_type: decimal(38,8)
        description: Price times quantity, in the quote currency (USDT).
      - name: is_buyer_maker
        description: "True when the buyer's order was already on the book (the trade was a sell into a bid)."
        data_type: boolean
      - name: captured_live
        data_type: boolean
        description: True when the Crypto project captured this trade live.
      - name: is_anomaly
        data_type: boolean
        description: The Crypto project's live flag; null when it didn't capture the trade.
      - name: anomaly_type
        description: "Why the Crypto project flagged it: price, volume or both. Null when not flagged."
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: [price, volume, both]
      - name: price_z
        description: "The Crypto project's robust z-score of the price move. Null during its warm-up or when it didn't capture the trade."
        data_type: double
      - name: size_ratio
        description: "Trade size divided by the median recent size, from the Crypto project. Null when not scored."
        data_type: double

  - name: fct_reconciliation_daily
    description: >
      Per symbol and UTC day, the Crypto project's live capture against the exchange's official record.
      completeness_pct covers the Crypto project's capture sessions (trades lost while it was running);
      day_coverage_pct covers the whole day, so it also reflects how long the Crypto project was switched off.
    config:
      contract: {enforced: true}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [symbol, trade_date]
      - dbt_utils.expression_is_true:
          arguments:
            expression: >-
              matched_trades + missed_in_window = official_in_window
              and missed_while_running + missed_during_downtime = missed_in_window
              and matched_trades <= captured_trades
    columns:
      - name: symbol
        description: "{{ doc('col_symbol') }}"
        data_type: varchar
        constraints: [{type: not_null}]
      - name: trade_date
        description: "{{ doc('col_trade_date') }}"
        data_type: date
        constraints: [{type: not_null}]
      - name: official_trades
        description: "Trades in the exchange's official record that day."
        data_type: bigint
      - name: captured_trades
        description: "Trades the Crypto project captured live that day."
        data_type: bigint
      - name: matched_trades
        description: "Trades present on both sides."
        data_type: bigint
      - name: official_in_window
        data_type: bigint
        description: Official trades between the Crypto project's first and last captured ID that day.
      - name: missed_in_window
        data_type: bigint
        description: All trades missing between the Crypto project's first and last captured trade that day.
      - name: official_in_sessions
        data_type: bigint
        description: Official trades inside the Crypto project's capture sessions.
      - name: missed_while_running
        data_type: bigint
        description: Trades lost inside a capture session (a real capture failure), filled from the record.
      - name: missed_during_downtime
        data_type: bigint
        description: Trades between sessions, while the Crypto project was switched off, filled from the record.
      - name: capture_sessions
        data_type: bigint
        description: Stretches of capture separated by more than capture_session_break_minutes with nothing captured.
      - name: stream_only_trades
        data_type: bigint
        description: Captured trades the exchange has no record of (should always be 0).
      - name: price_mismatches
        description: "Matched trades whose captured price differs from the official one."
        data_type: bigint
      - name: quantity_mismatches
        description: "Matched trades whose captured quantity differs from the official one."
        data_type: bigint
      - name: first_captured_id
        description: "Lowest trade ID the Crypto project captured that day."
        data_type: bigint
      - name: last_captured_id
        description: "Highest trade ID the Crypto project captured that day."
        data_type: bigint
      - name: completeness_pct
        description: "Share of official trades captured inside the Crypto project's capture sessions (the SLO measure). Null when it didn't run."
        data_type: double
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: day_coverage_pct
        description: "Share of the whole day's official trades captured; mostly reflects how long the Crypto project ran."
        data_type: double
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: stream_extracted
        description: "True when the day was copied from the Crypto project (even if it captured nothing)."
        data_type: boolean
      - name: status
        data_type: varchar
        description: "One verdict per symbol and day: complete, gaps_filled (lost while running), downtime_filled (switched off for part of the day), disagrees, not_captured, stream_not_extracted or awaiting_official_record."
        constraints: [{type: not_null}]
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - complete
                  - gaps_filled
                  - downtime_filled
                  - disagrees
                  - not_captured
                  - stream_not_extracted
                  - awaiting_official_record

  - name: fct_ohlcv_daily
    description: Daily candles per symbol from the complete official record.
    config:
      contract: {enforced: true}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [symbol, trade_date]
      - dbt_utils.expression_is_true:
          arguments:
            expression: >-
              low_price <= least(open_price, close_price, vwap)
              and high_price >= greatest(open_price, close_price, vwap)
    columns:
      - name: symbol
        description: "{{ doc('col_symbol') }}"
        data_type: varchar
        constraints: [{type: not_null}]
      - name: trade_date
        description: "{{ doc('col_trade_date') }}"
        data_type: date
        constraints: [{type: not_null}]
      - name: open_price
        description: "Price of the day's first trade (lowest trade ID)."
        data_type: decimal(20,8)
      - name: high_price
        description: "Highest trade price of the day."
        data_type: decimal(20,8)
      - name: low_price
        description: "Lowest trade price of the day."
        data_type: decimal(20,8)
      - name: close_price
        description: "Price of the day's last trade (highest trade ID)."
        data_type: decimal(20,8)
      - name: volume
        data_type: decimal(38,8)
        description: Base-currency volume (for example BTC).
      - name: quote_volume
        data_type: decimal(38,8)
        description: Quote-currency volume (USDT).
      - name: vwap
        data_type: decimal(20,8)
        description: Volume-weighted average price.
      - name: trade_count
        description: "Number of official trades that day."
        data_type: bigint

  - name: fct_anomalies_daily
    description: The Crypto project's live anomaly flags per symbol and day (only days it captured anything).
    config:
      contract: {enforced: true}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [symbol, trade_date]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "anomalies = price_anomalies + volume_anomalies + both_anomalies and scored_trades <= captured_trades"
    columns:
      - name: symbol
        description: "{{ doc('col_symbol') }}"
        data_type: varchar
        constraints: [{type: not_null}]
      - name: trade_date
        description: "{{ doc('col_trade_date') }}"
        data_type: date
        constraints: [{type: not_null}]
      - name: captured_trades
        description: "Trades the Crypto project captured that day."
        data_type: bigint
      - name: scored_trades
        data_type: bigint
        description: Captured trades past the detector's warm-up (they have a score).
      - name: anomalies
        description: "Captured trades the Crypto project flagged as anomalous."
        data_type: bigint
      - name: price_anomalies
        description: "Flagged for an unusual price move only."
        data_type: bigint
      - name: volume_anomalies
        description: "Flagged for an unusually large size only."
        data_type: bigint
      - name: both_anomalies
        description: "Flagged for both price and size."
        data_type: bigint
      - name: anomaly_rate_pct
        description: "Anomalies as a share of scored trades."
        data_type: double

  - name: fct_trade_gaps
    description: >
      The Crypto project's reported gaps and whether the lakehouse filled each from the official record.
      The lakehouse never writes back, so resolved_in_crypto_project_at_utc stays as the Crypto project set it.
    config:
      contract: {enforced: true}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [symbol, first_missing_id]
    columns:
      - name: symbol
        description: "{{ doc('col_symbol') }}"
        data_type: varchar
        constraints: [{type: not_null}]
      - name: first_missing_id
        description: "First trade ID in the gap the Crypto project reported."
        data_type: bigint
        constraints: [{type: not_null}]
      - name: last_missing_id
        description: "Last trade ID in the gap."
        data_type: bigint
      - name: missing_count
        description: "Trades in the gap."
        data_type: bigint
      - name: trade_date
        data_type: date
        description: UTC day of the gap's first missing trade; null until the official record for it is fetched.
      - name: filled_count
        description: "How many of the gap's trades are now in fct_trades from the official record."
        data_type: bigint
      - name: official_record_covers_gap
        data_type: boolean
        description: The official record has the trades on both sides of the gap, so the whole gap must be filled.
      - name: filled_by_lakehouse
        description: "True when every trade in the gap has been filled."
        data_type: boolean
      - name: fill_status
        description: "filled, partly_filled (the rest is on a day not fetched yet) or awaiting_official_record."
        data_type: varchar
        constraints: [{type: not_null}]
        data_tests:
          - accepted_values:
              arguments:
                values: [filled, partly_filled, awaiting_official_record]
      - name: detected_at_utc
        description: "When the Crypto project's gap checker found the gap."
        data_type: timestamp
      - name: resolved_in_crypto_project_at_utc
        description: "When the Crypto project marked it resolved; usually null, since the lakehouse never writes back."
        data_type: timestamp
