version: 2

models:
  - name: int_weather_latest
    description: >
      `stg_weather_hourly` with overlapping forecasts removed: for each city and
      hour, only the value from the most recent run (`fetched_at_utc`) is kept.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [city_id, forecast_hour_utc]
