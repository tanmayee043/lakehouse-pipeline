version: 2

# Raw crypto files, read in place by DuckDB. Day folders (trade_date=YYYY-MM-DD) become a
# date column, so filters on trade_date skip the other days' files entirely.
sources:
  - name: crypto_raw
    description: Files landed by ingestion/crypto/ from Binance.US and Project 1 (read-only).
    tables:
      - name: exchange_trades
        description: The exchange's official record of every trade, one file per symbol per UTC day.
        meta:
          external_location: >-
            read_parquet('{{ env_var('LAKEHOUSE_DATA_DIR', '../data') }}/raw_crypto/exchange_trades/trade_date=*/*.parquet',
            hive_partitioning = true)
        # Yesterday is fetched each morning, so the newest trade is normally under a day and a half old.
        config:
          loaded_at_field: "max(trade_time)"
          freshness:
            warn_after: {count: 36, period: hour}
            error_after: {count: 60, period: hour}

      - name: stream_trades
        description: Trades Project 1 captured live, copied from its Postgres one UTC day at a time.
        meta:
          external_location: >-
            read_parquet('{{ env_var('LAKEHOUSE_DATA_DIR', '../data') }}/raw_crypto/stream_trades/trade_date=*/*.parquet',
            hive_partitioning = true)

      - name: stream_extracts
        description: >
          One row per stream file, including empty ones: which days were copied from Project 1
          at all. Tells "Project 1 captured nothing" apart from "never copied".
        meta:
          external_location: >-
            glob('{{ env_var('LAKEHOUSE_DATA_DIR', '../data') }}/raw_crypto/stream_trades/trade_date=*/trades.parquet')

      - name: trade_gaps
        description: Snapshots of Project 1's trade_gaps table (missing trade-ID ranges), one per run.
        meta:
          external_location: >-
            read_parquet('{{ env_var('LAKEHOUSE_DATA_DIR', '../data') }}/raw_crypto/trade_gaps/snapshot_date=*/*.parquet',
            hive_partitioning = true)
