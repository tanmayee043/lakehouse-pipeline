version: 2

models:
  - name: stg_cities
    description: Cleaned city list, keyed by `city_id`.
    columns:
      - name: city_id
        description: ASCII slug of the city name, matching the raw JSON file name.
        data_tests: [unique, not_null]
      - name: latitude
        description: "Latitude in degrees."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: -90, max_value: 90}
      - name: longitude
        description: "Longitude in degrees."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: -180, max_value: 180}
      - name: population
        description: "Population from the city list."
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, inclusive: false}

  - name: stg_weather_hourly
    description: >
      Raw forecasts with the hourly arrays unnested: one row per city, per run
      date, per forecast hour. Still contains overlapping forecasts from
      different runs.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [city_id, fetched_on, forecast_hour_utc]
    columns:
      - name: city_id
        description: "{{ doc('col_city_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('stg_cities'), field: city_id}
      - name: timezone
        description: IANA zone returned by Open-Meteo, e.g. `Asia/Tokyo`.
        data_tests: [not_null]
      - name: forecast_hour_local
        description: Wall-clock hour in the city's own timezone.
      - name: forecast_hour_utc
        description: The same hour in UTC (DST-aware conversion).
        data_tests: [not_null]
      - name: source_file
        description: Raw JSON file the row came from, for tracing back.
