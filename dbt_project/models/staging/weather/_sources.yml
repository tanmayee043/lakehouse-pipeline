version: 2

sources:
  - name: raw
    description: Files landed by ingestion/fetch_weather.py, read in place by DuckDB.
    tables:
      - name: cities
        description: The 79 cities the pipeline tracks (data/raw_csv/cities.csv).
        meta:
          external_location: >-
            read_csv('{{ env_var('LAKEHOUSE_DATA_DIR', '../data') }}/raw_csv/cities.csv',
            header = true)

      - name: weather_forecasts
        description: >
          One JSON file per city per run date, holding the untouched Open-Meteo
          response under `weather` plus the city metadata.
        meta:
          external_location: >-
            read_json('{{ env_var('LAKEHOUSE_DATA_DIR', '../data') }}/raw_json/fetched_on=*/*.json',
            filename = true)
        # `dbt source freshness`: a daily job that ran on time is under 26 h old;
        # past 50 h at least one run was missed.
        config:
          loaded_at_field: "cast(fetched_at as timestamptz)"
          freshness:
            warn_after: {count: 26, period: hour}
            error_after: {count: 50, period: hour}
