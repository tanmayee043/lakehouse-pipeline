name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Check types
        run: mypy .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # dbt reads the committed sample data, never the live API.
      LAKEHOUSE_DATA_DIR: ${{ github.workspace }}/tests/data
      # Job-level env can't use the `runner` context, so keep the warehouse in the workspace.
      LAKEHOUSE_DUCKDB_PATH: ${{ github.workspace }}/ci.duckdb
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt_project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: dbt build on the sample data (models + contracts + tests)
        working-directory: dbt_project
        run: |
          dbt deps
          dbt build
      # Integration tests start a throwaway Postgres with Testcontainers (Docker is on the runner).
      - name: Unit, integration and smoke tests
        run: pytest -v

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      # The real dashboard in a real browser, against a warehouse built from the sample data
      - name: End-to-end dashboard test
        run: pytest -m e2e -v
