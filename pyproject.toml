[project]
name = "lakehouse-pipeline"
version = "0.1.0"
requires-python = ">=3.11"

# `dagster dev` run from the repo root loads this module, so both
# dagster_project/ and ingestion/ are importable as packages.
[tool.dagster]
module_name = "dagster_project.definitions"
code_location_name = "lakehouse"

[tool.ruff]
line-length = 120
extend-exclude = ["venv", "dbt_project/dbt_packages", "dbt_project/target"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: runs dbt against the sample data in tests/data (takes ~30 s)",
]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
exclude = '^(venv|data|dbt_project|dagster_home)/'

[tool.ruff.lint.isort]
known-first-party = ["ingestion", "dagster_project", "queries"]
